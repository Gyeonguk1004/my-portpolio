<style>
  :root{
    --paper:#F7F4EC;
    --paper-deep:#EAE3D1;
    --ink:#24262B;
    --ink-soft:#6B6E76;
    --ink-faint:#A2A5AC;
    --line:#DDD5C2;
    --navy:#2C3A54;
    --navy-deep:#1E2A3F;
    --amber:#B9822F;
    --amber-soft:#F1E3C8;
    --sage:#4B7A5B;
    --sage-soft:#DEEBE1;
    --wine:#9C5252;
    --wine-soft:#F1DEDE;
    --card:#FFFDF8;
    --radius:14px;
    --shadow:0 1px 2px rgba(36,38,43,.06), 0 10px 28px -14px rgba(36,38,43,.28);
    --serif:'Noto Serif KR', serif;
    --sans:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    background-image: radial-gradient(var(--paper-deep) 1px, transparent 1px);
    background-size: 20px 20px;
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button, input, textarea, select{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--navy); outline-offset:2px; }

  #shell{ max-width:560px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative; }
  @media (min-width:680px){
    #shell{ margin:32px auto; min-height:calc(100vh - 64px); border-radius:20px; box-shadow:var(--shadow); border:1px solid var(--line); overflow:hidden; }
  }

  #app{ padding-bottom:48px; }

  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:24px 20px 16px; border-bottom:1px solid var(--line); }
  .brand h1{ font-family:var(--serif); font-weight:900; font-size:26px; margin:0 0 4px; letter-spacing:-.02em; }
  .brand p{ margin:0; color:var(--ink-soft); font-size:13px; }
  .btn{ border:none; border-radius:10px; padding:10px 16px; font-weight:600; font-size:14px; white-space:nowrap; transition:transform .08s ease, opacity .15s ease, background .3s ease, border-color .3s ease, color .3s ease; }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:hover{ background:var(--navy-deep); }
  .btn-ghost{ background:transparent; color:var(--navy); border:1px solid var(--line); }
  .btn-ghost:hover{ background:#fff; }
  .btn-danger{ background:transparent; color:var(--wine); border:1px solid var(--wine-soft); }
  .btn-danger:hover{ background:var(--wine-soft); }
  .btn-sm{ padding:6px 12px; font-size:13px; border-radius:8px; }
  .btn-icon{ background:transparent; border:none; color:var(--ink-soft); font-size:20px; line-height:1; padding:4px 8px; border-radius:8px; }
  .btn-icon:hover{ background:var(--paper-deep); color:var(--ink); }
  .btn:disabled{ opacity:.5; cursor:default; }

  .tabs{ display:flex; gap:6px; padding:14px 20px 0; overflow-x:auto; }
  .tab{ background:transparent; border:1px solid transparent; border-bottom:none; padding:9px 14px; border-radius:10px 10px 0 0; font-size:13px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
  .tab.active{ background:var(--card); border-color:var(--line); color:var(--ink); position:relative; top:1px; }
  .tab .count{ color:var(--ink-faint); font-weight:500; margin-left:2px; }
  .tab.active .count{ color:var(--ink-soft); }
  .tabline{ border-bottom:1px solid var(--line); margin:0 20px; }

  .list{ padding:18px 20px 8px; display:flex; flex-direction:column; gap:12px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px; box-shadow:var(--shadow); text-align:left; width:100%;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    animation: rise .35s ease both;
  }
  .list .card:nth-child(1){ animation-delay:.02s; }
  .list .card:nth-child(2){ animation-delay:.06s; }
  .list .card:nth-child(3){ animation-delay:.1s; }
  .list .card:nth-child(4){ animation-delay:.14s; }
  .list .card:nth-child(n+5){ animation-delay:.16s; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } }
  .card-main{ min-width:0; }
  .card-company{ font-family:var(--sans); font-weight:700; font-size:15.5px; margin:0 0 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-position-inline{ font-weight:500; color:var(--ink-soft); font-size:14px; }
  .card-meta{ margin:0 0 3px; font-size:12.5px; color:var(--ink-soft); font-family:var(--sans); }
  .card-meta:last-child{ margin-bottom:0; }
  .tag-row{ margin:2px 0 8px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--paper-deep); color:var(--ink-soft); margin-right:6px; }

  .stamp{ flex:none; width:60px; height:60px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-family:var(--serif); font-weight:900; letter-spacing:.5px; transform:rotate(-9deg); text-align:center; line-height:1.1; }
  .stamp-icon{ font-size:20px; line-height:1; }
  .stamp-label{ font-size:10px; font-weight:800; line-height:1; }
  .stamp.passed{ border:3px double var(--sage); color:var(--sage); }
  .stamp.rejected{ border:3px double var(--wine); color:var(--wine); }
  .stamp.in_progress{ border:3px dashed var(--amber); color:var(--amber); font-weight:800; }
  .stamp.planned{ border:3px solid var(--navy); color:var(--navy); font-weight:900; font-size:15px; }
  .stamp-sm{ width:50px; height:50px; }
  .stamp-sm .stamp-icon{ font-size:17px; }
  .stamp-sm .stamp-label{ font-size:8.5px; }
  .stamp-sm.planned{ font-size:12px; }
  @keyframes thud{ 0%{ transform:rotate(-9deg) scale(1.35); opacity:0; } 60%{ transform:rotate(-9deg) scale(.94); opacity:1; } 100%{ transform:rotate(-9deg) scale(1); } }
  .stamp.stamp-in{ animation: thud .4s ease; }

  .empty{ padding:56px 24px; text-align:center; color:var(--ink-soft); }
  .empty h3{ font-family:var(--serif); font-size:18px; color:var(--ink); margin:0 0 6px; }
  .empty p{ margin:0 0 18px; font-size:14px; }

  .footer-link{ display:block; text-align:center; padding:22px 20px 6px; }
  .footer-link button{ background:none; border:none; color:var(--ink-faint); font-size:12.5px; text-decoration:underline; }

  .header-row{ display:flex; align-items:center; justify-content:space-between; padding:18px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); z-index:5; }
  .save-indicator{ font-size:12px; color:var(--ink-faint); font-family:var(--mono); }
  .save-indicator.dirty{ color:var(--amber); }
  .save-indicator.err{ color:var(--wine); }

  .section{ padding:20px; border-bottom:1px solid var(--line); }
  .section:last-child{ border-bottom:none; }
  .eyebrow{ font-size:12px; letter-spacing:.08em; color:var(--ink); font-weight:800; text-transform:uppercase; margin:0 0 12px; }

  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; min-width:0; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
  .field input[type=text], .field input[type=date], .field input[type=password], .field textarea, .field input[list], .field select{
    width:100%; border:1px solid var(--line); background:#fff; border-radius:9px; padding:10px 12px; font-size:14.5px; color:var(--ink);
  }
  .field input[type=file]{ width:100%; font-size:12.5px; color:var(--ink-soft); }
  .field textarea{ resize:vertical; min-height:76px; line-height:1.5; }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--navy); }
  .hint{ font-size:12px; color:var(--ink-faint); margin-top:5px; }
  .error-text{ font-size:12.5px; color:var(--wine); margin-top:5px; }

  .segmented{ display:flex; gap:8px; }
  .segmented.small .seg-btn{ padding:8px 6px; font-size:13px; }
  .seg-btn{ flex:1; border:1px solid var(--line); background:#fff; border-radius:9px; padding:10px 8px; font-size:13.5px; font-weight:600; color:var(--ink-soft); }
  .seg-btn.active{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .seg-btn.active[data-val="in_progress"]{ background:var(--amber-soft); border-color:var(--amber); color:#8a611f; }
  .seg-btn.active[data-val="passed"]{ background:var(--sage-soft); border-color:var(--sage); color:var(--sage); }
  .seg-btn.active[data-val="rejected"]{ background:var(--wine-soft); border-color:var(--wine); color:var(--wine); }
  .seg-btn.active[data-val="planned"]{ background:#DDE4EE; border-color:var(--navy); color:var(--navy); }

  .stage-item{ padding:10px 0; border-bottom:1px dashed var(--line); }
  .stage-item:last-of-type{ border-bottom:none; }
  .stage-row{ display:flex; align-items:center; gap:8px; }
  .stage-feedback-wrap{ margin-top:6px; }
  .stage-feedback{ width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; line-height:1.5; resize:vertical; background:#fff; }

  .mode-nav{ display:flex; gap:6px; padding:14px 20px 0; }
  .mode-tab{ flex:1; background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 4px; font-size:12px; font-weight:600; color:var(--ink-soft); text-align:center; }
  .mode-tab.active{ background:var(--navy); border-color:var(--navy); color:#fff; }

  .map-grid-wrap{ padding:20px 20px 4px; overflow-x:auto; }
  .map-ocean{ position:relative; background:linear-gradient(180deg, #D6EFF7 0%, #ABE0EF 55%, #8FD1E6 100%); border-radius:20px; padding:24px 58px 24px 16px; overflow:hidden; width:max-content; margin:0 auto; }
  .map-ocean::before{ content:""; position:absolute; inset:0; background-image:radial-gradient(circle, rgba(255,255,255,.45) 1.6px, transparent 1.6px); background-size:24px 24px; opacity:.6; pointer-events:none; }
  .map-decor{ position:absolute; font-size:15px; opacity:.9; pointer-events:none; z-index:1; }
  .map-grid{ display:grid; grid-template-columns:repeat(5, 58px); grid-auto-rows:58px; gap:5px; margin:0 auto; width:max-content; position:relative; z-index:2; }
  .map-cell{ border:1px solid var(--line); border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; font-weight:700; padding:2px; transition:background .2s ease; }
  .map-cell.active{ outline:2px solid var(--amber); outline-offset:1px; }
  .map-cell-count{ font-size:13px; font-weight:900; margin-top:1px; }
  .map-island-group{ position:absolute; top:40px; right:14px; display:flex; flex-direction:column; align-items:center; gap:14px; z-index:2; }
  .map-island{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .map-island-dot{ width:16px; height:16px; border-radius:50%; background:#D8B478; border:2px solid #AD8952; box-shadow:0 2px 3px rgba(0,0,0,.15); }
  .map-island-dot.dokdo{ width:9px; height:9px; }
  .map-island-label{ font-size:8.5px; font-weight:800; color:#5b4a2f; white-space:nowrap; }

  .portfolio-headline{ font-family:var(--sans); font-weight:800; font-size:16px; color:var(--ink); margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .portfolio-view-grid{ display:grid; grid-template-columns:auto 1fr; gap:7px 12px; align-items:baseline; }
  .portfolio-view-label{ font-weight:800; color:var(--ink); font-size:13px; white-space:nowrap; }
  .portfolio-view-value{ color:var(--ink); font-weight:600; font-size:14px; }
  .portfolio-chip{ display:inline-block; background:var(--navy); color:#fff; font-weight:700; font-size:12.5px; padding:4px 12px; border-radius:999px; }

  .profile-photo-circle{ width:96px; height:96px; border-radius:50%; margin:0 auto; background-size:cover; background-position:center; border:2px solid var(--line); }

  function fmtDate(iso){ if(!iso) return "날짜 미정"; var p = iso.split("-"); if(p.length<3) return iso; return p[0]+"."+p[1]+"."+p[2]; }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function getApp(id){ return state.apps.find(function(a){ return a.id === id; }); }
  function statusLabel(s){ return s==="planned" ? "지원예정" : s==="passed" ? "합격" : s==="rejected" ? "불합격" : "진행중"; }
  function computeDday(deadline){
    if(!deadline) return "D-?";
    var today = new Date(todayStr()+"T00:00:00");
    var target = new Date(deadline+"T00:00:00");
    var diffDays = Math.round((target - today) / 86400000);
    if(diffDays > 0) return "D-"+diffDays;
    if(diffDays === 0) return "D-DAY";
    return "마감";
  }
  function renderStatusStamp(a, sizeClass){
    if(a.status === "planned"){
      return '<div class="stamp '+sizeClass+' planned" title="지원예정">'+computeDday(a.deadline)+'</div>';
    }
    var icon = a.status === "passed" ? "✓" : a.status === "rejected" ? "✕" : "⋯";
    return '<div class="stamp '+sizeClass+' '+a.status+'" title="'+statusLabel(a.status)+'">'
      + '<span class="stamp-icon">'+icon+'</span>'
      + '<span class="stamp-label">'+statusLabel(a.status)+'</span>'
      + '</div>';
  }
  function stageResultLabel(r){ return r==="pass" ? "통과" : r==="fail" ? "탈락" : "대기중"; }
  function nextScheduleText(app){
    var pending = app.stages.filter(function(s){ return s.result === "pending" && s.date; });
    if(!pending.length) return "";
    pending.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    return pending[0].name + " · " + fmtDate(pending[0].date);
  }
  function jobTypeLabel(v){ return v==="research" ? "연구직" : v==="office" ? "사무직" : ""; }
  function employmentTypeLabel(v){ return v==="regular" ? "정규직" : v==="contract" ? "계약직" : ""; }

  function newApp(company, position, appliedDate){
    var now = Date.now();
    return {
      id: uid(), company: company, position: position, appliedDate: appliedDate || todayStr(),
      status: "in_progress",
      jobType: "", employmentType: "",
      sido: "", sigungu: "",
      deadline: "",
      stages: [],
      rejection: { stageName:"", date:"", reason:"", memo:"" },
      coverLetters: [],
      memo: "",
      createdAt: now, updatedAt: now
    };
  }

  // ---------- firebase auth + firestore ----------
  var auth = null, db = null, storage = null;

  function storageErrorMessage(err){
    var code = err && err.code;
    if(code === "storage/unauthorized") return "이 파일에 접근할 권한이 없어요.";
    if(code === "storage/quota-exceeded") return "저장 공간이 가득 찼어요.";
    if(code === "storage/canceled") return "업로드가 취소됐어요.";
    return "파일 업로드에 실패했어요. Firebase Storage가 활성화됐는지 확인해주세요.";
  }

  function authErrorMessage(err){
    var code = err && err.code;
    if(code === "auth/user-not-found") return "등록되지 않은 이메일이에요.";
    if(code === "auth/unauthorized-domain") return "이 주소가 아직 Firebase에 등록되지 않았어요. Authorized domains에 추가해주세요.";
    if(code === "auth/account-exists-with-different-credential") return "이미 이메일/비밀번호로 가입된 계정이에요. 그 방식으로 로그인해주세요.";
    if(code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials") return "아이디 또는 비밀번호가 올바르지 않아요.";
    if(code === "auth/weak-password") return "비밀번호는 6자 이상으로 입력해주세요.";
    if(code === "auth/invalid-email") return "이메일 형식이 올바르지 않아요. (예: example@gmail.com)";
    if(code === "auth/too-many-requests") return "시도가 너무 많아요. 잠시 후 다시 시도해주세요.";
    if(code === "auth/network-request-failed") return "인터넷 연결을 확인해주세요.";
    if(code === "auth/email-already-in-use") return "이미 사용 중인 아이디예요.";
    return "로그인에 실패했어요. 다시 시도해주세요.";
  }

  function loadUserData(uidStr){
    return db.collection("users").doc(uidStr).get().then(function(doc){
      var result = { applications: [], portfolio: emptyPortfolio() };
      if(doc.exists && doc.data()){
        var data = doc.data();
        if(data.applications){ try{ result.applications = JSON.parse(data.applications); }catch(e){} }
        if(data.portfolio){ try{ result.portfolio = Object.assign(emptyPortfolio(), JSON.parse(data.portfolio)); }catch(e){} }
      }
      return result;
    });
  }

  function saveApps(){
    if(!state.authed || !state.firebaseUser) return Promise.resolve();
    state.saveStatus = "saving"; updateSaveIndicator();
    return db.collection("users").doc(state.firebaseUser.uid).set({
      applications: JSON.stringify(state.apps),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true}).then(function(){
      state.saveStatus = "saved"; updateSaveIndicator();
    }).catch(function(){
      state.saveStatus = "error"; updateSaveIndicator();
      showToast("저장하지 못했어요. 인터넷 연결을 확인해주세요.");
    });
  }

  function savePortfolio(){
    if(!state.authed || !state.firebaseUser) return Promise.resolve();
    state.saveStatus = "saving"; updateSaveIndicator();
    return db.collection("users").doc(state.firebaseUser.uid).set({
      portfolio: JSON.stringify(state.portfolio),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true}).then(function(){
      state.saveStatus = "saved"; updateSaveIndicator();
    }).catch(function(){
      state.saveStatus = "error"; updateSaveIndicator();
      showToast("저장하지 못했어요. 인터넷 연결을 확인해주세요.");
    });
  }

  function handlePortfolioFileSelect(el){
    var cat = el.getAttribute("data-portfolio-cat");
    var itemId = el.getAttribute("data-item");
    var file = el.files && el.files[0];
    if(!file) return;
    if(!storage){ state.sdkError = "파일 저장소 연결이 준비되지 않았어요."; render(); return; }
    if(file.size > 10 * 1024 * 1024){ showToast("파일이 너무 커요. 10MB 이하로 올려주세요."); return; }
    var entry = state.portfolio[cat] && state.portfolio[cat].find(function(x){ return x.id === itemId; });
    if(!entry) return;

    entry.fileStatus = "uploading";
    render();

    var path = "users/" + state.firebaseUser.uid + "/portfolio/" + cat + "/" + entry.id + "-" + Date.now() + "-" + file.name;
    storage.ref().child(path).put(file).then(function(snapshot){
      return snapshot.ref.getDownloadURL();
    }).then(function(url){
      entry.fileUrl = url;
      entry.fileName = file.name;
      entry.filePath = path;
      entry.fileStatus = "";
      render();
      savePortfolio();
    }).catch(function(err){
      entry.fileStatus = "";
      showToast(storageErrorMessage(err));
      render();
    });
  }

  function deletePortfolioFile(cat, itemId){
    var entry = state.portfolio[cat] && state.portfolio[cat].find(function(x){ return x.id === itemId; });
    if(!entry) return;
    var oldPath = entry.filePath;
    entry.fileUrl = ""; entry.fileName = ""; entry.filePath = "";
    render(); savePortfolio();
    if(oldPath && storage){
      storage.ref().child(oldPath).delete().catch(function(){});
    }
  }

  var PROFILE_PHOTO_MAX_BYTES = 5 * 1024 * 1024; // 5MB cap for profile photos
  function handleProfilePhotoSelect(el){
    var file = el.files && el.files[0];
    if(!file) return;
    if(!storage){ state.sdkError = "파일 저장소 연결이 준비되지 않았어요."; render(); return; }

    state.portfolio.profilePhotoStatus = "uploading";
    render();

    var path = "users/" + state.firebaseUser.uid + "/profile/" + Date.now() + "-" + file.name;
    storage.ref().child(path).put(file).then(function(snapshot){
      return snapshot.ref.getDownloadURL();
    }).then(function(url){
      state.portfolio.profilePhotoUrl = url;
      state.portfolio.profilePhotoName = file.name;
      state.portfolio.profilePhotoPath = path;
      state.portfolio.profilePhotoStatus = "";
      render();
      savePortfolio();
    }).catch(function(err){
      state.portfolio.profilePhotoStatus = "";
      showToast(storageErrorMessage(err));
      render();
    });
  }

  function deleteProfilePhoto(){
    var oldPath = state.portfolio.profilePhotoPath;
    state.portfolio.profilePhotoUrl = ""; state.portfolio.profilePhotoName = ""; state.portfolio.profilePhotoPath = "";
    render(); savePortfolio();
    if(oldPath && storage){
      storage.ref().child(oldPath).delete().catch(function(){});
    }
  }

  function attemptLogin(id, pin){
    if(!auth){ state.sdkError = "Firebase 연결이 준비되지 않았어요. 실제 브라우저 탭에서 이 파일을 열었는지 확인해주세요."; render(); return; }
    if(pin.length < 6){ state.loginError = "비밀번호는 6자 이상으로 입력해주세요."; render(); return; }
    state.loading = true; state.loginError = ""; render();
    var email = id.trim().toLowerCase();
    auth.signInWithEmailAndPassword(email, pin).catch(function(){
      return auth.createUserWithEmailAndPassword(email, pin).catch(function(createErr){
        if(createErr && createErr.code === "auth/email-already-in-use"){
          return Promise.reject({code:"auth/wrong-password"});
        }
        return Promise.reject(createErr);
      });
    }).then(function(cred){
      state.firebaseUser = cred.user;
      state.userId = id;
      return loadUserData(cred.user.uid);
    }).then(function(data){
      state.apps = data.applications || [];
      state.portfolio = data.portfolio || emptyPortfolio();
      state.authed = true; state.loading = false; state.view = "list"; state.loginError = "";
      render();
    }).catch(function(err){
      state.loading = false; state.authed = false;
      state.loginError = authErrorMessage(err);
      render();
    });
  }

  function requestPasswordReset(){
    var idEl = document.getElementById("loginId");
    var email = idEl ? idEl.value.trim().toLowerCase() : "";
    if(!email){ state.loginError = "재설정 메일을 받을 이메일을 먼저 입력해주세요."; render(); return; }
    if(!auth){ state.sdkError = "Firebase 연결이 준비되지 않았어요."; render(); return; }
    auth.sendPasswordResetEmail(email).catch(function(){}).then(function(){
      showToast("등록된 이메일이면 재설정 링크를 보냈어요. 받은편지함(스팸함 포함)을 확인해주세요.");
    });
  }

  function signInWithGoogle(){
    if(!auth){ state.sdkError = "Firebase 연결이 준비되지 않았어요."; render(); return; }
    state.loginError = "";
    state.loading = true; render();
    try{
      var provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(function(err){
        state.loading = false;
        var code = err && err.code;
        if(code === "auth/popup-blocked"){
          state.loginError = "팝업이 차단됐어요. 브라우저의 팝업 차단을 해제하고 다시 시도해주세요.";
        } else if(code !== "auth/popup-closed-by-user" && code !== "auth/cancelled-popup-request"){
          state.loginError = authErrorMessage(err);
        }
        render();
      });
    }catch(e){
      state.loading = false;
      state.loginError = "구글 로그인을 시작하지 못했어요.";
      render();
    }
  }

  function doLogout(){
    auth.signOut().then(function(){
      state.authed = false; state.userId = ""; state.firebaseUser = null; state.apps = [];
      state.portfolio = emptyPortfolio(); state.portfolioEditing = {}; state.mode = "jobs";
      state.stageFeedbackOpen = {}; state.mapSelectedSido = "";
      state.loginError = ""; state.view = "list"; state.filter = "all"; state.currentId = null;
      render();
    });
  }

  function initAuth(){
    if(!CONFIG_READY){ state.loading = false; render(); return; }
    if(typeof firebase === "undefined"){
      state.loading = false;
      state.sdkError = "Firebase 라이브러리를 불러오지 못했어요. 이 화면(미리보기) 안이 아니라 실제 브라우저 탭에서 파일을 열어주세요.";
      render(); return;
    }
    if(!auth){
      try{
        firebase.initializeApp(FIREBASE_CONFIG);
        auth = firebase.auth();
        db = firebase.firestore();
        storage = firebase.storage();
      }catch(e){
        state.loading = false;
        state.sdkError = "Firebase 초기화에 실패했어요: " + (e && e.message ? e.message : "알 수 없는 오류");
        render(); return;
      }
    }
    state.loading = true; state.authTimedOut = false; render();

    var authTimeout = setTimeout(function(){
      state.loading = false;
      state.authTimedOut = true;
      render();
    }, 9000);

    auth.onAuthStateChanged(function(user){
      clearTimeout(authTimeout);
      if(user){
        state.firebaseUser = user;
        state.userId = user.email;
        var dataTimeout = setTimeout(function(){
          state.loading = false;
          state.authTimedOut = true;
          render();
        }, 9000);
        loadUserData(user.uid).then(function(data){
          clearTimeout(dataTimeout);
          state.apps = data.applications || [];
          state.portfolio = data.portfolio || emptyPortfolio();
          state.authed = true; state.loading = false; state.authTimedOut = false; state.view = "list";
          render();
        }).catch(function(){
          clearTimeout(dataTimeout);
          state.loading = false;
          state.authTimedOut = true;
          render();
        });
      } else {
        state.authed = false; state.loading = false; state.authTimedOut = false; render();
      }
    }, function(){
      clearTimeout(authTimeout);
      state.loading = false;
      state.authTimedOut = true;
      render();
    });
  }

  function updateSaveIndicator(){
    var el = document.getElementById("saveIndicator");
    if(!el) return;
    el.classList.remove("dirty","err");
    if(state.saveStatus === "dirty"){ el.textContent = "변경사항 저장 필요"; el.classList.add("dirty"); }
    else if(state.saveStatus === "saving"){ el.textContent = "저장 중..."; }
    else if(state.saveStatus === "saved"){ el.textContent = "저장됨"; }
    else if(state.saveStatus === "error"){ el.textContent = "저장 실패 · 다시 시도"; el.classList.add("err"); }
    else { el.textContent = ""; }
  }

  function markDirty(){
    state.saveStatus = "dirty";
    updateSaveIndicator();
  }

  function updateSegButtons(container, activeVal){
    if(!container) return;
    var btns = container.querySelectorAll(".seg-btn");
    btns.forEach(function(b){
      if(b.getAttribute("data-val") === activeVal) b.classList.add("active");
      else b.classList.remove("active");
    });
  }

  function showToast(msg){
    var root = document.getElementById("toastRoot");
    root.innerHTML = '<div class="toast">' + escapeHtml(msg) + '</div>';
    setTimeout(function(){ root.innerHTML = ""; }, 3200);
  }

  // ---------- render ----------
  function renderModeNav(){
    var items = [["jobs","지원한 직장"], ["map","지원한 직장 지도"], ["portfolio","나의 포트폴리오"]];
    return '<div class="mode-nav">' + items.map(function(it){
      var active = state.mode === it[0];
      return '<button class="mode-tab'+(active?' active':'')+'" data-action="set-mode" data-mode="'+it[0]+'">'+it[1]+'</button>';
    }).join("") + '</div>';
  }

  function render(){
    var root = document.getElementById("app");
    if(!CONFIG_READY){ root.innerHTML = renderSetupNeeded(); renderModal(); return; }
    if(state.sdkError){ root.innerHTML = renderSdkError(); renderModal(); return; }
    if(state.authTimedOut){ root.innerHTML = renderAuthTimeout(); renderModal(); return; }
    if(state.loading){ root.innerHTML = '<div class="loading">'+(state.authed ? '지원 기록을 불러오는 중...' : '로그인 확인 중...')+'</div>'; renderModal(); return; }
    if(!state.authed){ root.innerHTML = renderLogin(); renderModal(); return; }
    if(state.mode === "portfolio"){ root.innerHTML = renderModeNav() + renderPortfolio(); renderModal(); updateSaveIndicator(); return; }
    if(state.mode === "map"){ root.innerHTML = renderModeNav() + renderJobMap(); renderModal(); return; }
    if(state.view === "add") root.innerHTML = renderAdd();
    else if(state.view === "detail") root.innerHTML = renderDetail(getApp(state.currentId));
    else root.innerHTML = renderModeNav() + renderList();
    renderModal();
    updateSaveIndicator();
  }

  function renderList(){
    var counts = { all: state.apps.length, planned:0, in_progress:0, passed:0, rejected:0 };
    state.apps.forEach(function(a){ counts[a.status] = (counts[a.status]||0)+1; });

    var tabs = [["all","전체"],["planned","지원예정"],["in_progress","진행중"],["rejected","불합격"],["passed","합격"]].map(function(t){
      var active = state.filter === t[0];
      return '<button class="tab'+(active?' active':'')+'" data-action="set-filter" data-filter="'+t[0]+'">'+t[1]+' <span class="count">'+counts[t[0]]+'</span></button>';
    }).join("");

    var filtered = state.apps.filter(function(a){ return state.filter === "all" || a.status === state.filter; });
    if(state.filter === "planned"){
      filtered.sort(function(a,b){ return (a.deadline||"9999-99-99").localeCompare(b.deadline||"9999-99-99"); });
    } else {
      filtered.sort(function(a,b){ return (b.appliedDate||"").localeCompare(a.appliedDate||"") || b.createdAt-a.createdAt; });

  function renderPortfolioCard(cat, schema, entry){
    var editing = !!state.portfolioEditing[entry.id];
    var bodyHtml = editing ? renderPortfolioCardEdit(cat, schema, entry) : renderPortfolioCardView(schema, entry);
    var toggleIcon = editing ? "✓" : "✎";
    var toggleTitle = editing ? "완료" : "수정";

    return ''
      + '<div class="cl-block">'
      +   '<div class="cl-top">'
      +     '<button class="btn-icon" data-action="toggle-portfolio-edit" data-cat="'+cat+'" data-item="'+entry.id+'" title="'+toggleTitle+'">'+toggleIcon+'</button>'
      +     '<button class="btn-icon" data-action="delete-portfolio-entry" data-cat="'+cat+'" data-item="'+entry.id+'" title="삭제">×</button>'
      +   '</div>'
      +   bodyHtml
      + '</div>';
  }

  function renderPortfolioCardView(schema, entry){
    var headlineKeys = schema.headlineKeys || [];
    var headline = schema.headline ? schema.headline(entry) : "";
    var headlineHtml = headline ? '<p class="portfolio-headline">'+escapeHtml(headline)+'</p>' : "";
    var rows = schemaFields(schema, entry).filter(function(f){
      return headlineKeys.indexOf(f.key) === -1;
    }).map(function(f){
      var val = entry[f.key];
      if(!val) return "";
      var displayVal = f.type === "date" ? fmtDate(val) : escapeHtml(val);
      var valueHtml = f.type === "select"
        ? '<span class="portfolio-chip">'+displayVal+'</span>'
        : '<span class="portfolio-view-value">'+displayVal+'</span>';
      return '<span class="portfolio-view-label">'+escapeHtml(f.label)+'</span>'+valueHtml;
    }).join("");
    rows = rows ? '<div class="portfolio-view-grid">'+rows+'</div>' : (headline ? "" : '<p class="hint" style="margin:0;">입력된 내용이 없어요.</p>');
    var fileRow = entry.fileUrl
      ? '<p style="margin:8px 0 0;font-size:13px;"><a href="'+escapeHtml(entry.fileUrl)+'" target="_blank" rel="noopener" style="color:var(--navy);font-weight:700;text-decoration:underline;">📎 '+escapeHtml(entry.fileName||"첨부파일")+'</a></p>'
      : "";
    return headlineHtml + rows + fileRow;
  }

  function renderPortfolioCardEdit(cat, schema, entry){
    var fieldsHtml = schemaFields(schema, entry).map(function(f){
      var val = entry[f.key] || "";
      var inputHtml;
      if(f.type === "select"){
        inputHtml = '<select data-portfolio-cat="'+cat+'" data-item="'+entry.id+'" data-field="'+f.key+'">'
          + '<option value=""></option>'
          + f.options.map(function(o){ return '<option value="'+escapeHtml(o)+'"'+(val===o?" selected":"")+'>'+escapeHtml(o)+'</option>'; }).join("")
          + '</select>';
      } else if(f.type === "textarea"){
        inputHtml = '<textarea rows="3" data-portfolio-cat="'+cat+'" data-item="'+entry.id+'" data-field="'+f.key+'" placeholder="'+escapeHtml(f.placeholder||"")+'">'+escapeHtml(val)+'</textarea>';
      } else if(f.type === "date"){
        inputHtml = '<input type="date" data-portfolio-cat="'+cat+'" data-item="'+entry.id+'" data-field="'+f.key+'" value="'+escapeHtml(val)+'">';
      } else {
        inputHtml = '<input type="text" data-portfolio-cat="'+cat+'" data-item="'+entry.id+'" data-field="'+f.key+'" placeholder="'+escapeHtml(f.placeholder||"")+'" value="'+escapeHtml(val)+'">';
      }
      return '<div class="field"><label>'+f.label+'</label>'+inputHtml+'</div>';
    }).join("");

    var fileHtml;
    if(entry.fileStatus === "uploading"){
      fileHtml = '<div class="field"><label>첨부파일</label><p class="hint">업로드 중...</p></div>';
    } else if(entry.fileUrl){
      fileHtml = ''
        + '<div class="field"><label>첨부파일</label>'
        +   '<div style="display:flex;align-items:center;gap:8px;">'
        +     '<a href="'+escapeHtml(entry.fileUrl)+'" target="_blank" rel="noopener" style="font-size:13.5px;color:var(--navy);text-decoration:underline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">📎 '+escapeHtml(entry.fileName||"첨부파일")+'</a>'
        +     '<button class="btn-icon" data-action="delete-portfolio-file" data-cat="'+cat+'" data-item="'+entry.id+'" title="삭제">×</button>'
        +   '</div>'
        + '</div>';
    } else {
      fileHtml = ''
        + '<div class="field"><label>첨부파일 (선택 — 증명서·사진 등)</label>'
        +   '<input type="file" accept="image/*,.pdf" data-file-upload="true" data-portfolio-cat="'+cat+'" data-item="'+entry.id+'">'
        + '</div>';
    }

    return fieldsHtml + fileHtml;
  }

  function renderJobMap(){
    var counts = {};
    state.apps.forEach(function(a){ if(a.sido){ counts[a.sido] = (counts[a.sido]||0)+1; } });
    var maxCount = 0;
    Object.keys(counts).forEach(function(k){ if(counts[k] > maxCount) maxCount = counts[k]; });

    var cellsHtml = SIDO_GRID.map(function(r){
      var count = counts[r.name] || 0;
      var bg = regionColor(count, maxCount);
      var ratio = maxCount > 0 ? count / maxCount : 0;
      var textColor = count > 0 ? (ratio > 0.33 ? "#fff" : "var(--ink)") : "var(--ink-faint)";
      var active = state.mapSelectedSido === r.name;
      return '<button class="map-cell'+(active?' active':'')+'" data-action="select-map-region" data-sido="'+escapeHtml(r.name)+'" '
        + 'style="grid-column:'+(r.col+1)+';grid-row:'+(r.row+1)+';background:'+bg+';color:'+textColor+';">'
        + '<span>'+r.short+'</span>'
        + (count ? '<span class="map-cell-count">'+count+'</span>' : '')
        + '</button>';
    }).join("");

    var detailHtml;
    var selected = state.mapSelectedSido;
    if(selected){
      var appsInRegion = state.apps.filter(function(a){ return a.sido === selected; });
      var bySigungu = {};
      appsInRegion.forEach(function(a){ var g = a.sigungu || "미지정"; bySigungu[g] = (bySigungu[g]||0)+1; });
      var sigunguTags = Object.keys(bySigungu).map(function(g){
        return '<span class="tag">'+escapeHtml(g)+' '+bySigungu[g]+'</span>';
      }).join("");
      var companyList = appsInRegion.length
        ? '<div class="list" style="padding:12px 0 0;">' + appsInRegion.map(function(a){
            return ''
              + '<button class="card" data-action="go-detail-from-map" data-id="'+a.id+'">'
              +   '<div class="card-main">'
              +     '<p class="card-company">'+escapeHtml(a.company||"회사명 미정")+'</p>'
              +     '<p class="card-position">'+escapeHtml(a.position||"")+(a.sigungu?' · '+escapeHtml(a.sigungu):'')+'</p>'
              +   '</div>'
              +   '<div class="stamp stamp-sm '+a.status+'">'+statusLabel(a.status)+'</div>'
              + '</button>';
          }).join("") + '</div>'
        : '<p class="hint">이 지역에 등록된 지원이 없어요.</p>';
      detailHtml = ''
        + '<div class="section">'
        +   '<p class="eyebrow">'+escapeHtml(selected)+' ('+appsInRegion.length+'건)</p>'
        +   (sigunguTags ? '<div class="tag-row">'+sigunguTags+'</div>' : '')
        +   companyList
        + '</div>';
    } else {
      detailHtml = '<div class="section"><p class="hint">지역을 눌러보면 그 지역에 지원한 회사 목록이 보여요. 지원할 때 지역(시/도, 시/군/구)을 선택해두면 여기 표시돼요.</p></div>';
    }

    return ''
      + '<div class="topbar" style="border-bottom:none;padding-bottom:4px;">'
      +   '<div class="brand"><h1 style="font-size:22px;">지원한 직장 지도</h1><p>지역별로 몇 곳에 지원했는지 한눈에 봐요</p></div>'
      + '</div>'
      + '<div class="map-grid-wrap">'
      +   '<div class="map-ocean">'
      +     '<span class="map-decor" style="top:10px;left:14px;">🫧</span>'
      +     '<span class="map-decor" style="bottom:14px;left:36px;">🐠</span>'
      +     '<span class="map-decor" style="top:16px;left:120px;">🌊</span>'
      +     '<span class="map-decor" style="bottom:18px;right:80px;">⛵</span>'
      +     '<div class="map-grid">'+cellsHtml+'</div>'
      +     '<div class="map-island-group">'
      +       '<div class="map-island" title="울릉도"><div class="map-island-dot"></div><span class="map-island-label">울릉도</span></div>'
      +       '<div class="map-island" title="독도"><div class="map-island-dot dokdo"></div><span class="map-island-label">독도</span></div>'
      +     '</div>'
      +   '</div>'
      + '</div>'
      + detailHtml;
  }

  function renderModal(){
    var root = document.getElementById("modalRoot");
    if(!state.confirm){ root.innerHTML = ""; return; }
    var c = state.confirm;
    var yesLabel = c.yesLabel || "삭제";
    var noLabel = c.noLabel || "취소";
    var yesClass = c.yesLabel ? "btn-primary" : "btn-danger";
    root.innerHTML = ''
      + '<div class="modal-overlay">'
      +   '<div class="modal-box">'
      +     '<p>'+escapeHtml(c.message)+'</p>'
      +     '<div class="modal-actions">'
      +       '<button class="btn btn-ghost btn-sm" data-action="confirm-no">'+escapeHtml(noLabel)+'</button>'
      +       '<button class="btn '+yesClass+' btn-sm" data-action="confirm-yes">'+escapeHtml(yesLabel)+'</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';
  }

  // ---------- field editing ----------
  function resolveTarget(el){
    var appId = el.getAttribute("data-app");
    if(!appId) return null;
    var app = getApp(appId);
    if(!app) return null;
    var field = el.getAttribute("data-field");
    var arr = el.getAttribute("data-arr");
    var item = el.getAttribute("data-item");
    if(arr && item){
      var list = app[arr];
      var obj = list && list.find(function(x){ return x.id === item; });
      if(!obj) return null;
      return { app: app, obj: obj, field: field };
    }
    if(field && field.indexOf(".") > -1){
      var parts = field.split(".");
      return { app: app, obj: app[parts[0]], field: parts[1] };
    }
    return { app: app, obj: app, field: field };
  }

  function handleFieldEvent(e){
    var el = e.target;
    if(!el.getAttribute) return;
    var role = el.getAttribute("data-role");
    if(role === "new-sido-select"){
      state.newSido = el.value;
      var newSigunguEl = document.getElementById("newSigungu");
      if(newSigunguEl) populateSigunguSelect(newSigunguEl, el.value, "");
      return;
    }
    if(role === "detail-sido-select"){
      var dsAppId = el.getAttribute("data-app");
      var dsApp = getApp(dsAppId);
      if(dsApp){
        dsApp.sido = el.value; dsApp.sigungu = ""; dsApp.updatedAt = Date.now();
        markDirty();
      }
      var sigunguSelEl = document.getElementById("sigungu-select-"+dsAppId);
      if(sigunguSelEl) populateSigunguSelect(sigunguSelEl, el.value, "");
      return;
    }
    if(el.getAttribute("data-profile-photo-upload")){
      handleProfilePhotoSelect(el);
      return;
    }
    if(el.getAttribute("data-file-upload")){
      handlePortfolioFileSelect(el);
      return;
    }
    var portfolioCat = el.getAttribute("data-portfolio-cat");
    if(portfolioCat){
      var itemId = el.getAttribute("data-item");
      var field = el.getAttribute("data-field");
      var entry = state.portfolio[portfolioCat] && state.portfolio[portfolioCat].find(function(x){ return x.id === itemId; });
      if(!entry) return;
      entry[field] = el.value;
      markDirty();
      if(portfolioCat === "education" && field === "degree"){ render(); }
      return;
    }
    if(!el.getAttribute("data-field")) return;
    var t = resolveTarget(el);
    if(!t) return;
    t.obj[t.field] = el.value;
    t.app.updatedAt = Date.now();
    markDirty();
  }

  // ---------- actions ----------
  function performDelete(action, id){
    if(action === "delete-app"){
      state.apps = state.apps.filter(function(a){ return a.id !== id; });
      state.view = "list"; state.currentId = null;
      render(); saveApps();
    } else if(action === "reset-all"){
      state.apps = [];
      state.view = "list";
      render(); saveApps();
    }
  }

  function onClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    if(action === "do-login"){
      var idVal = document.getElementById("loginId").value.trim();
      var pinVal = document.getElementById("loginPin").value;
      if(!idVal || !pinVal){ state.loginError = "아이디와 비밀번호를 모두 입력해주세요."; render(); return; }
      attemptLogin(idVal, pinVal);
    }
    else if(action === "logout"){ doLogout(); }
    else if(action === "forgot-password"){ requestPasswordReset(); }
    else if(action === "retry-auth"){ state.authTimedOut = false; initAuth(); }
    else if(action === "google-login"){ signInWithGoogle(); }
    else if(action === "go-add"){ state.view = "add"; state.addError = ""; state.newJobType = ""; state.newEmploymentType = ""; state.newSido = ""; state.newStatus = "in_progress"; render(); }
    else if(action === "go-list"){
      if(state.view === "detail" && state.saveStatus === "dirty") saveApps();
      state.view = "list"; render();
    }
    else if(action === "go-detail"){ state.view = "detail"; state.currentId = id; state.saveStatus = "idle"; render(); }
    else if(action === "set-filter"){ state.filter = el.getAttribute("data-filter"); render(); }

    else if(action === "set-mode"){
      var newMode = el.getAttribute("data-mode");
      if(state.mode === "portfolio" && state.saveStatus === "dirty") savePortfolio();
      state.mode = newMode;
      if(newMode === "jobs") state.view = "list";
      state.mapSelectedSido = "";
      state.saveStatus = "idle";
      render();
    }
    else if(action === "select-map-region"){
      var mSido = el.getAttribute("data-sido");
      state.mapSelectedSido = (state.mapSelectedSido === mSido) ? "" : mSido;
      render();
    }
    else if(action === "go-detail-from-map"){
      state.mode = "jobs"; state.view = "detail"; state.currentId = id; state.saveStatus = "idle";
      render();
    }
    else if(action === "add-portfolio-entry"){
      var pCat = el.getAttribute("data-cat");
      var newEntry = newPortfolioEntry(pCat);
      state.portfolioEditing[newEntry.id] = true;
      state.portfolio[pCat].push(newEntry);
      render(); savePortfolio();
    }
    else if(action === "delete-portfolio-entry"){
      var dCat = el.getAttribute("data-cat");
      var dItem = el.getAttribute("data-item");
      state.portfolio[dCat] = state.portfolio[dCat].filter(function(x){ return x.id !== dItem; });
      delete state.portfolioEditing[dItem];
      render(); savePortfolio();
    }
    else if(action === "delete-portfolio-file"){
      deletePortfolioFile(el.getAttribute("data-cat"), el.getAttribute("data-item"));
    }
    else if(action === "delete-profile-photo"){ deleteProfilePhoto(); }
    else if(action === "toggle-portfolio-edit"){
      var tItem = el.getAttribute("data-item");
      if(state.portfolioEditing[tItem]) delete state.portfolioEditing[tItem];
      else state.portfolioEditing[tItem] = true;
      render();
    }
    else if(action === "save-portfolio-now"){
      var pBtn = el;
      var pCat = pBtn.getAttribute("data-cat");
      var pOriginalText = pBtn.textContent;
      pBtn.disabled = true; pBtn.textContent = "저장 중...";
      savePortfolio().then(function(){
        var ok = state.saveStatus === "saved";
        pBtn.disabled = false;
        pBtn.textContent = ok ? "저장됨 ✓" : "저장 실패 · 다시 시도";
        pBtn.style.background = ok ? "#4B7A5B" : "#9C5252";
        pBtn.style.borderColor = ok ? "#4B7A5B" : "#9C5252";
        setTimeout(function(){
          if(ok && pCat && state.portfolio[pCat]){
            state.portfolio[pCat].forEach(function(en){ delete state.portfolioEditing[en.id]; });
            render();
          } else {
            pBtn.textContent = pOriginalText;
            pBtn.style.background = "";
            pBtn.style.borderColor = "";
          }
        }, 2200);
      });
    }

    else if(action === "confirm-add"){
      var company = document.getElementById("newCompany").value.trim();
      var position = document.getElementById("newPosition").value.trim();
      var dateVal = document.getElementById("newDate").value || todayStr();
      if(!company || !position){ state.addError = "회사명과 직무는 꼭 입력해주세요."; render(); return; }
      var a = newApp(company, position, dateVal);
      a.status = state.newStatus;
      a.jobType = state.newJobType; a.employmentType = state.newEmploymentType;
      var newSidoEl = document.getElementById("newSido");
      var newSigunguEl = document.getElementById("newSigungu");
      a.sido = newSidoEl ? newSidoEl.value : "";
      a.sigungu = newSigunguEl ? newSigunguEl.value : "";
      var newDeadlineEl = document.getElementById("newDeadline");
      a.deadline = newDeadlineEl ? newDeadlineEl.value : "";
      if(a.status === "rejected" && !a.rejection.date){ a.rejection.date = todayStr(); }
      state.apps.push(a);
      state.addError = "";
      var then = el.getAttribute("data-then");
      if(then === "list"){ state.view = "list"; state.currentId = null; }
      else { state.currentId = a.id; state.view = "detail"; }
      render(); saveApps();
    }

    else if(action === "set-new-jobtype"){ state.newJobType = el.getAttribute("data-val"); updateSegButtons(el.parentElement, state.newJobType); }
    else if(action === "set-new-employment"){ state.newEmploymentType = el.getAttribute("data-val"); updateSegButtons(el.parentElement, state.newEmploymentType); }
    else if(action === "set-new-status"){ state.newStatus = el.getAttribute("data-status"); updateSegButtons(el.parentElement, state.newStatus); }

    else if(action === "set-jobtype"){
      var appJ = getApp(id);
      if(!appJ) return;
      appJ.jobType = el.getAttribute("data-val"); appJ.updatedAt = Date.now();
      render(); saveApps();
    }
    else if(action === "set-employment"){
      var appE = getApp(id);
      if(!appE) return;
      appE.employmentType = el.getAttribute("data-val"); appE.updatedAt = Date.now();
      render(); saveApps();
    }

    else if(action === "set-status"){
      var app = getApp(id);
      if(!app) return;
      app.status = el.getAttribute("data-status");
      if(app.status === "rejected"){
        if(!app.rejection.date) app.rejection.date = todayStr();
        if(!app.rejection.stageName && app.stages.length) app.rejection.stageName = app.stages[app.stages.length-1].name;
      }
      app.updatedAt = Date.now();
      render(); saveApps();
    }

    else if(action === "add-stage-preset"){
      var app2 = getApp(id);
      if(!app2) return;
      app2.stages.push({ id: uid(), name: el.getAttribute("data-name"), date: todayStr(), result: "pending", feedback: "" });
      app2.updatedAt = Date.now();
      render(); saveApps();
    }
    else if(action === "add-stage-custom"){
      var app3 = getApp(id);
      if(!app3) return;
      app3.stages.push({ id: uid(), name: "새 단계", date: todayStr(), result: "pending", feedback: "" });
      app3.updatedAt = Date.now();
      render(); saveApps();
    }
    else if(action === "delete-stage"){
      var app4 = getApp(id);
      if(!app4) return;
      app4.stages = app4.stages.filter(function(s){ return s.id !== el.getAttribute("data-stage"); });
      app4.updatedAt = Date.now();
      render(); saveApps();
    }
    else if(action === "toggle-stage-feedback"){
      state.stageFeedbackOpen[el.getAttribute("data-stage")] = true;
      render();
    }

    else if(action === "add-cl"){
      var app5 = getApp(id);
      if(!app5) return;
      app5.coverLetters.push({ id: uid(), question:"", answer:"" });
      app5.updatedAt = Date.now();
      render(); saveApps();
    }
    else if(action === "delete-cl"){
      var app6 = getApp(id);
      if(!app6) return;
      app6.coverLetters = app6.coverLetters.filter(function(c){ return c.id !== el.getAttribute("data-cl"); });
      app6.updatedAt = Date.now();
      render(); saveApps();
    }

    else if(action === "save-now"){ saveApps(); state.view = "list"; render(); }

    else if(action === "ask-delete-app"){ state.confirm = { message:"이 지원 기록을 삭제할까요? 되돌릴 수 없어요.", action:"delete-app", payload:id }; renderModal(); }
    else if(action === "ask-reset-all"){ state.confirm = { message:"모든 지원 기록을 삭제할까요? 되돌릴 수 없어요.", action:"reset-all", payload:null }; renderModal(); }
    else if(action === "confirm-yes"){
      var c = state.confirm; state.confirm = null;
      if(c) performDelete(c.action, c.payload);
      else renderModal();
    }
    else if(action === "confirm-no"){ state.confirm = null; renderModal(); }
  }

  // ---------- PWA install support ----------
  try{
    if("serviceWorker" in navigator){
      var swSource = "self.addEventListener('install',function(e){self.skipWaiting();});"
        + "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});"
        + "self.addEventListener('fetch',function(e){});";
      var swBlob = new Blob([swSource], {type:"application/javascript"});
      var swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(function(){});
    }
  }catch(e){}

  // ---------- init ----------
  document.addEventListener("click", onClick);
  document.addEventListener("input", handleFieldEvent);
  document.addEventListener("change", handleFieldEvent);

  initAuth();
})();
</script>
</body>
</html>
